name: deploy-tenant
on:
  workflow_dispatch:
    inputs:
      tenant_name:
        description: Tenant to deploy keys to
        required: true
        type: environment   # dropdown of the repo's environments, so no typos

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-keys.yml
    with:
      tenant_name: ${{ inputs.tenant_name }}
    secrets: inherit
