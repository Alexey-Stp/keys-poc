name: deploy keys (reusable)
# Called by deploy-tenant and deploy-tenant-all. One tenant = one GitHub environment of the same name.
on:
  workflow_call:
    inputs:
      tenant_name:
        required: true
        type: string

jobs:
  deploy-keys:
    name: ${{ inputs.tenant_name }}
    runs-on: windows-latest
    # Tenant-only secrets and KEYS_DIR live in the environment; global secrets stay repo secrets
    environment: ${{ inputs.tenant_name }}
    concurrency:
      group: deploy-keys-${{ inputs.tenant_name }}
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, same as the SSC deploy runners
    env:
      KEYS_DIR: ${{ vars.KEYS_DIR }}   # e.g. D:\Carecorp\SSC\XML\Keys
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Secrets only in this step's env. Mapping key = KEYFILE_<SCOPE>__<exact file name>.
      - name: deploy keys
        env:
          TENANT_NAME: ${{ inputs.tenant_name }}
          KEYFILE_GLOBAL__SSC_SFTPPrivateKey.openSSH: ${{ secrets.POC_SSC_SFTP_PRIVATE_KEY }}
          KEYFILE_GLOBAL__PGPPrivateKey.pgp:          ${{ secrets.POC_PGP_PRIVATE_KEY }}
          KEYFILE_GLOBAL__PGPPublicKey.pgp:           ${{ secrets.POC_PGP_PUBLIC_KEY }}
          KEYFILE_GLOBAL__PGPPassPhrase.txt:          ${{ secrets.POC_PGP_PASSPHRASE }}
          KEYFILE_CARECORP1__CarecorpPublicPGH.pgp:   ${{ secrets.POC_CARECORP_PUBLIC_PGP }}   # carecorp1 environment
        # input passed via env, not ${{ }} inside the script, so it can't inject PowerShell
        run: |
          if (-not $env:KEYS_DIR) { throw "Environment '$env:TENANT_NAME' has no KEYS_DIR variable" }
          .\deploy-keys.ps1 -TenantName $env:TENANT_NAME -OutputDir $env:KEYS_DIR

      - name: list output keys and hashes
        run: |
          Write-Host $env:KEYS_DIR
          Get-ChildItem -LiteralPath $env:KEYS_DIR -File | Sort-Object Name | ForEach-Object {
            [pscustomobject]@{
              File   = $_.Name
              Bytes  = $_.Length
              SHA256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          } | Format-Table -AutoSize | Out-String -Width 200
