name: deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # 1. Tenant keys first: each job sees only its own environment's TENANT_KEYS.
  #    A missing secret fails here, before any tenant is touched.
  deploy-tenant-keys:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        tenant: ${{ fromJSON(vars.TENANTS_WITH_CUSTOM_KEYS) }}
    environment: ${{ matrix.tenant }}
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, same as the SSC deploy runners
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: decode tenant keys into config\<tenant>\Keys\tenant
        env:
          TENANT: ${{ matrix.tenant }}
          TENANT_KEYS: ${{ secrets.TENANT_KEYS }}
        run: |
          $server = .\scripts\get-tenant-server.ps1 -Tenant $env:TENANT
          $configDir = "$env:RUNNER_TEMP\servers\$server\config"
          .\scripts\write-tenant-keys.ps1 -ConfigDir $configDir -Tenant $env:TENANT
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Flat folder for the artifact: a wildcard path would keep SB21\config\... inside it
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\tenant-keys-out" -Force | Out-Null
          Copy-Item -Path "$configDir\$env:TENANT\Keys\tenant\*" -Destination "$env:RUNNER_TEMP\tenant-keys-out"

      - uses: actions/upload-artifact@v4
        with:
          name: tenant-keys-${{ matrix.tenant }}
          path: ${{ runner.temp }}/tenant-keys-out/
          if-no-files-found: error
          retention-days: 1

  # 2. One job for every server and tenant, like production-deployment-all (no environment,
  #    so only repository secrets). Per tenant: mirror app, shared keys, tenant keys, merge,
  #    robocopy check, then start the app pool (scripts/deploy-tenant.ps1).
  deploy-all:
    needs: deploy-tenant-keys
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: tenant-keys-*
          path: ${{ runner.temp }}\tenant-keys

      - name: build once per server, deploy every tenant
        env:
          KEY_SFTP_PRIVATE: ${{ secrets.KEY_SFTP_PRIVATE }}
          KEY_PGP_PRIVATE:  ${{ secrets.KEY_PGP_PRIVATE }}
          KEY_PGP_PUBLIC:   ${{ secrets.KEY_PGP_PUBLIC }}
          KEY_APNS_P8:      ${{ secrets.KEY_APNS_P8 }}
          KEY_LEGACY_P12:   ${{ secrets.KEY_LEGACY_P12 }}
          TENANTS_WITH_CUSTOM_KEYS: ${{ vars.TENANTS_WITH_CUSTOM_KEYS }}
        run: |
          $ErrorActionPreference = 'Stop'
          $custom = @($env:TENANTS_WITH_CUSTOM_KEYS | ConvertFrom-Json | ForEach-Object { $_ })
          $servers = Get-Content -Raw tenants.json | ConvertFrom-Json
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### deploy-all`n`n")
          foreach ($server in $servers.PSObject.Properties) {
            $serverDir = Join-Path $env:RUNNER_TEMP "servers\$($server.Name)"
            $build = .\scripts\new-build.ps1 -ServerDir $serverDir
            foreach ($tenant in @($server.Value)) {
              $from = $null
              if ($custom -contains $tenant) {
                $from = Join-Path $env:RUNNER_TEMP "tenant-keys\tenant-keys-$tenant"
                if (-not (Test-Path -LiteralPath $from)) { throw "Artifact tenant-keys-$tenant not found" }
              }
              .\scripts\deploy-tenant.ps1 -ServerDir $serverDir -Tenant $tenant -BuildDir $build -TenantKeysFrom $from
            }
          }

      # Same checks on the live folders, where timestamps are exact (the zip below keeps 2-second times)
      - name: verify before upload
        run: |
          $configDirs = @(Get-ChildItem -Path "$env:RUNNER_TEMP\servers\*\config" -Directory | ForEach-Object FullName)
          .\scripts\verify-keys.ps1 -ConfigDir $configDirs -Expected hashes.json

      - name: pack servers
        run: Compress-Archive -Path "$env:RUNNER_TEMP\servers" -DestinationPath "$env:RUNNER_TEMP\servers-final.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: servers-final
          path: ${{ runner.temp }}\servers-final.zip
          retention-days: 1

  # 3. Verify the final state as a separate job.
  verify:
    needs: deploy-all
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: servers-final
          path: ${{ runner.temp }}

      - name: verify keys, app folders, pool order
        run: |
          Expand-Archive -Path "$env:RUNNER_TEMP\servers-final.zip" -DestinationPath $env:RUNNER_TEMP
          $configDirs = @(Get-ChildItem -Path "$env:RUNNER_TEMP\servers\*\config" -Directory | ForEach-Object FullName)
          .\scripts\verify-keys.ps1 -ConfigDir $configDirs -Expected hashes.json -SummaryPath $env:GITHUB_STEP_SUMMARY
