name: Key files PoC
on:
  workflow_dispatch:
    inputs:
      tenant_name:
        description: Tenant to write keys for
        required: true
        default: default
        type: choice
        options: [default, carecorp1]

jobs:
  deploy-keys:
    runs-on: windows-latest
    # Tenant-only secrets live in the environment of the same name; global ones stay repo secrets
    environment: ${{ inputs.tenant_name }}
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, same as the SSC deploy runners
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Secrets only in this step's env. Mapping key = KEYFILE_<SCOPE>__<exact file name>.
      - name: deploy keys
        env:
          TENANT_NAME: ${{ inputs.tenant_name }}
          KEYFILE_GLOBAL__PGPPrivateKey.pgp:       ${{ secrets.POC_PGP_PRIVATE_KEY }}
          KEYFILE_GLOBAL__PGPPassPhrase.txt:       ${{ secrets.POC_PGP_PASSPHRASE }}
          KEYFILE_CARECORP1__carecorp_partner.asc: ${{ secrets.POC_CARECORP1_PARTNER_KEY }}
        # input passed via env, not ${{ }} inside the script, so it can't inject PowerShell
        run: .\deploy-keys.ps1 -TenantName $env:TENANT_NAME

      - name: list output keys and hashes
        run: |
          Get-ChildItem .\output-keys -File | Sort-Object Name | ForEach-Object {
            [pscustomobject]@{
              File   = $_.Name
              Bytes  = $_.Length
              SHA256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            }
          } | Format-Table -AutoSize | Out-String -Width 200
