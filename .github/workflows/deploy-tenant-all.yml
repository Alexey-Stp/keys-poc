name: deploy-tenant-all
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # list the repo's environments

jobs:
  list-tenants:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    outputs:
      tenants: ${{ steps.list.outputs.tenants }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $names = @(gh api "repos/$env:GITHUB_REPOSITORY/environments" --paginate --jq '.environments[].name' | Where-Object { $_ })
          if ($LASTEXITCODE -ne 0) { throw "Could not list environments" }
          if ($names.Count -eq 0) { throw "No environments found" }
          Write-Host "Tenants: $($names -join ', ')"
          # AppendAllText = UTF-8 without BOM; '>>' in PowerShell 5.1 writes UTF-16
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tenants=$(ConvertTo-Json -InputObject $names -Compress)`n")

  deploy:
    needs: list-tenants
    strategy:
      fail-fast: false   # one tenant failing doesn't stop the others
      matrix:
        tenant: ${{ fromJSON(needs.list-tenants.outputs.tenants) }}
    uses: ./.github/workflows/_deploy-keys.yml
    with:
      tenant_name: ${{ matrix.tenant }}
    secrets: inherit
